name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queue new pushes instead of cancelling them.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build static site
        # BASE_PATH switches vite.config.ts into GitHub Pages mode: the site is
        # served from https://<user>.github.io/<repo>/, so assets need that prefix.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Prepare Pages artifact
        # SPA mode emits the prerendered shell as _shell.html. GitHub Pages
        # serves index.html for a directory and 404.html for unknown paths, so
        # client-side routing works when both point at the shell.
        run: |
          cp .output/public/_shell.html .output/public/index.html
          cp .output/public/_shell.html .output/public/404.html
          touch .output/public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
